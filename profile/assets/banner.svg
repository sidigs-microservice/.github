<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="SIDIGS Microservices — Sekolah Jadi Mudah">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1e2b45"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="340" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
    .node { fill: #111c31; stroke: #2a3a5c; stroke-width: 1.5; }
    .label { font-size: 15px; font-weight: 600; fill: #cbd5e1; }
    .wire { stroke: #2dd4bf; stroke-opacity: .35; stroke-width: 1.5; fill: none; }
    .pulse { fill: #2dd4bf; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="340" fill="#0a1222"/>
    <rect width="1280" height="340" fill="url(#dots)"/>
    <rect x="0" y="0" width="6" height="340" fill="#2dd4bf"/>

    <!-- left: wordmark -->
    <text x="72" y="92" class="mono" font-size="15" fill="#2dd4bf" letter-spacing="3">SIDIGS / ENGINEERING</text>
    <text x="68" y="168" class="sans" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-1.5">SIDIGS</text>
    <text x="72" y="212" class="sans" font-size="34" font-weight="300" fill="#94a3b8">Microservices</text>
    <text x="72" y="262" class="sans" font-size="19" fill="#e2e8f0">Sekolah Jadi Mudah <tspan fill="#64748b">— satu platform untuk seluruh sekolah.</tspan></text>
    <g class="mono" font-size="13" fill="#94a3b8">
      <rect x="72" y="284" width="118" height="28" rx="14" fill="#111c31" stroke="#2a3a5c"/>
      <text x="131" y="303" text-anchor="middle">NestJS</text>
      <rect x="200" y="284" width="118" height="28" rx="14" fill="#111c31" stroke="#2a3a5c"/>
      <text x="259" y="303" text-anchor="middle">Next.js</text>
      <rect x="328" y="284" width="118" height="28" rx="14" fill="#111c31" stroke="#2a3a5c"/>
      <text x="387" y="303" text-anchor="middle">Prisma</text>
      <rect x="456" y="284" width="118" height="28" rx="14" fill="#111c31" stroke="#2a3a5c"/>
      <text x="515" y="303" text-anchor="middle">MySQL</text>
    </g>

    <!-- right: gateway + services -->
    <g>
      <path class="wire" d="M960 170 L790 78"/>
      <path class="wire" d="M960 170 L790 170"/>
      <path class="wire" d="M960 170 L790 262"/>
      <path class="wire" d="M960 170 L1130 78"/>
      <path class="wire" d="M960 170 L1130 170"/>
      <path class="wire" d="M960 170 L1130 262"/>
      <path class="wire" d="M960 170 L960 52"/>
      <path class="wire" d="M960 170 L960 288"/>

      <circle class="pulse" r="4"><animateMotion dur="2.6s" repeatCount="indefinite" path="M960 170 L790 78"/></circle>
      <circle class="pulse" r="4"><animateMotion dur="3.1s" repeatCount="indefinite" path="M960 170 L1130 170"/></circle>
      <circle class="pulse" r="4"><animateMotion dur="2.2s" repeatCount="indefinite" path="M960 170 L790 262"/></circle>
      <circle class="pulse" r="4"><animateMotion dur="3.4s" repeatCount="indefinite" path="M960 170 L1130 78"/></circle>
      <circle class="pulse" r="4"><animateMotion dur="2.8s" repeatCount="indefinite" path="M960 170 L960 288"/></circle>

      <g class="sans">
        <rect class="node" x="720" y="58" width="140" height="40" rx="10"/><text class="label" x="790" y="83" text-anchor="middle">Academic</text>
        <rect class="node" x="720" y="150" width="140" height="40" rx="10"/><text class="label" x="790" y="175" text-anchor="middle">Exam</text>
        <rect class="node" x="720" y="242" width="140" height="40" rx="10"/><text class="label" x="790" y="267" text-anchor="middle">Finance</text>
        <rect class="node" x="1060" y="58" width="140" height="40" rx="10"/><text class="label" x="1130" y="83" text-anchor="middle">IAM</text>
        <rect class="node" x="1060" y="150" width="140" height="40" rx="10"/><text class="label" x="1130" y="175" text-anchor="middle">HR</text>
        <rect class="node" x="1060" y="242" width="140" height="40" rx="10"/><text class="label" x="1130" y="267" text-anchor="middle">Content</text>
        <rect class="node" x="900" y="18" width="120" height="36" rx="10"/><text class="label" x="960" y="41" text-anchor="middle">Web App</text>
        <rect class="node" x="890" y="286" width="140" height="36" rx="10"/><text class="label" x="960" y="309" text-anchor="middle">Organization</text>

        <circle cx="960" cy="170" r="50" fill="#0a1222" stroke="#2dd4bf" stroke-width="2"/>
        <circle cx="960" cy="170" r="62" fill="none" stroke="#2dd4bf" stroke-opacity=".2" stroke-width="1.5"/>
        <text x="960" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#2dd4bf">API</text>
        <text x="960" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#2dd4bf">GATEWAY</text>
      </g>
    </g>
  </g>
</svg>
